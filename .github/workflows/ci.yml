name: CI Pipeline

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install deps
        run: go mod tidy

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/app

      - name: Docker build
        run: docker build -t BE_Golang .
